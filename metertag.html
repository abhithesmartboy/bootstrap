<html>
<head>
<title>Meter Tag Example</title>
</head>
<body>

<h2>Example of &lt;meter&gt; Tag</h2>

<p>Disk usage:</p>
<meter value="0.7">70%</meter>

<p>Battery level:</p>
<meter value="0.4">40%</meter>

<p>Quiz score:</p>
<meter value="80" min="0" max="100">80 out of 100</meter>


</body>
</html>
