<html>
<head>
<title>BDI Tag Example</title>
</head>
<body>

<h2>Example of &lt;bdi&gt; Tag</h2>

<p>Without using bdi:</p>
<p>User name: محمد (from Saudi Arabia)</p>

<p>With using bdi:</p>
<p>User name: <bdi>محمد</bdi> (from Saudi Arabia)</p>

<p>Another example with mixed text:</p>
<p>List of users:</p>
<ul>
  <li><bdi>John</bdi> - 95 points</li>
  <li><bdi>محمد</bdi> - 88 points</li>
  <li><bdi>אבי</bdi> - 90 points</li>
</ul>

</body>
</html>
